<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Free Audit | PoppyPages Marketing</title>
    <meta name="description" content="Answer a few quick questions so we can build your free marketing audit.">
    <link rel="canonical" href="https://www.poppypages.com/chat">
    <meta name="theme-color" content="#1a0a25">
    <meta property="og:title" content="Your Free Audit | PoppyPages Marketing">
    <meta property="og:description" content="Answer a few quick questions so we can build your free marketing audit.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.poppypages.com/chat">
    <meta property="og:image" content="https://www.poppypages.com/assets/og-image.png">
    <meta property="og:site_name" content="PoppyPages Marketing">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="robots" content="noindex">
<!--@head-assets-->
<!--@gtag-->
</head>

<body class="chat-page">
<!--@sprite-->
    <header class="chat-top">
        <a class="brand" href="/" aria-label="PoppyPages Marketing home">
            <img src="/assets/poppy-mark.webp" width="38" height="38" alt="">
            <span class="brand-word">PoppyPages<small>Marketing</small></span>
        </a>
        <a class="chat-exit" href="/contact">Rather talk? Book a call</a>
    </header>

    <main class="chat-shell" id="main">
        <div class="chat-progress" aria-hidden="true">
            <span id="chat-step">Free audit</span>
            <div class="bar"><i id="chat-bar"></i></div>
            <span id="chat-pct">0%</span>
        </div>
        <h1 class="sr-only">Your free marketing audit</h1>
        <div class="chat-window" id="chat-window" role="log" aria-live="polite" aria-label="Audit questions"></div>
        <div class="chat-foot">
            <form class="chat-input" id="chat-form" hidden novalidate>
                <label for="chat-text" class="sr-only">Your answer</label>
                <input type="text" id="chat-text" autocomplete="off" placeholder="Type your answer">
                <button type="submit" aria-label="Send"><svg><use href="#i-arrow"/></svg></button>
            </form>
            <p class="chat-skip">Your answers are only used to build your audit. <a href="/thank-u" id="chat-skip-link">Skip the questions</a></p>
        </div>
        <noscript><p class="lead">This short form needs JavaScript. You can also email support@poppypages.com and we will take it from there.</p></noscript>
    </main>

    <script src="/js/chat.js" defer></script>
</body>

</html>
